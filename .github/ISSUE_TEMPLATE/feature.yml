name: Feature Request
description: Use this template to suggest new features or improvements to existing features in the project.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature or improvement!

  - type: input
    id: contact
    attributes:
      label: Contact Details
      placeholder: email@example.com
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      options:
        - High
        - Medium
        - Low
      description: Please select the priority of the feature request.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Please provide a detailed description of the feature request and its benefits.
    validations:
      required: true