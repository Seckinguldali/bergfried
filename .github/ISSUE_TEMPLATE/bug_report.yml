name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: input
    id: contact
    attributes:
      label: Contact Details
      placeholder: email@example.com
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      options:
        - High
        - Medium
        - Low
      description: Please select the priority of the bug.
    validations:
      required: true

  - type: textarea
    id: description_and_steps
    attributes:
      label: Description and Steps to Reproduce
      placeholder: Please provide a detailed description of the bug and the steps to reproduce it.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, device, etc.
    validations:
      required: true